[package]
name = "yauth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Modular, plugin-based authentication for Axum — passkey, MFA, OAuth, JWT, API keys"
readme = "../../README.md"
keywords = ["axum", "authentication", "webauthn", "totp", "oauth"]
categories = ["authentication", "web-programming"]
publish = true

[features]
default = ["email-password", "diesel-pg-backend"]
diesel-pg-backend = ["dep:diesel", "dep:diesel-async-crate", "diesel-async-crate/postgres", "diesel-async-crate/deadpool", "dep:futures-util"]
diesel-libsql-backend = ["dep:diesel", "dep:diesel-async-crate", "dep:diesel-libsql", "dep:futures-util"]
diesel-mysql-backend = ["dep:diesel", "diesel/mysql_backend", "dep:diesel-async-crate", "diesel-async-crate/mysql", "diesel-async-crate/deadpool", "dep:futures-util"]
diesel-sqlite-backend = ["dep:diesel", "diesel/sqlite", "dep:diesel-async-crate", "diesel-async-crate/sqlite", "diesel-async-crate/deadpool", "dep:futures-util"]
sqlx-pg-backend = ["dep:sqlx", "sqlx/postgres"]
sqlx-mysql-backend = ["dep:sqlx", "sqlx/mysql"]
sqlx-sqlite-backend = ["dep:sqlx", "sqlx/sqlite"]
seaorm-pg-backend = ["dep:sea-orm", "sea-orm/sqlx-postgres"]
seaorm-mysql-backend = ["dep:sea-orm", "sea-orm/sqlx-mysql"]
seaorm-sqlite-backend = ["dep:sea-orm", "sea-orm/sqlx-sqlite"]
memory-backend = []
email-password = []
passkey = ["dep:webauthn-rs"]
mfa = ["dep:totp-rs", "dep:qrcode-generator", "dep:base64"]
oauth = ["dep:oauth2"]
bearer = ["dep:jsonwebtoken"]
# Asymmetric JWT signing (RS256/ES256) + populated JWKS for cross-trust-domain M2M.
# Default deployments stay on HS256 — this only adds cost when explicitly enabled.
asymmetric-jwt = ["bearer", "dep:rsa", "dep:p256", "dep:base64"]
api-key = []
magic-link = []
admin = []
status = []
oauth2-server = ["dep:url", "dep:base64", "dep:serde_urlencoded"]
account-lockout = []
webhooks = ["dep:hmac", "dep:url"]
oidc = ["bearer", "oauth2-server"]
# Multi-tenancy primitive (issue #87). Adds Organization + Membership + Invitation
# entities, repos, and routes. Default OFF — flipping the flag on must not change any
# existing single-tenant behavior.
#
# Issue #93 (federated SSO) is bundled under this flag — pulls in
# `jsonwebtoken` for id_token validation against the IdP's JWKS and
# `chacha20poly1305` for client_secret encrypt-at-rest. Bringing them
# into the same gate keeps the dep tree simple.
organizations = ["dep:hickory-resolver", "dep:base64", "dep:serde_urlencoded", "dep:jsonwebtoken", "dep:chacha20poly1305", "dep:quick-xml", "dep:x509-parser", "dep:flate2", "dep:rsa"]
# SCIM 2.0 provisioning endpoints (issue #95). Requires `organizations`
# (for the per-org URL space + group→role mapping reuse) and `api-key`
# (for the org-scoped bearer auth IdPs send). Off by default — pure
# additive surface area mounted under `/api/scim/v2/...`. SCIM uses the
# RFC 7644 §3.12 error JSON shape rather than yauth's normal envelope,
# because that is what IdPs (Okta / Entra / OneLogin) parse.
scim = ["organizations", "api-key"]
# Issue #96 — Audit log SIEM/syslog export. Off by default. When on but no
# destinations are configured the outbox is idle. Depends on `webhooks`
# (HMAC + reqwest) and `admin` (replay endpoint guard).
audit-export = ["webhooks", "admin", "dep:hmac", "dep:url", "dep:object_store", "dep:bytes", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:webpki-roots", "yauth-entity/audit-export"]
telemetry =["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-semantic-conventions", "dep:opentelemetry-http"]
openapi = ["dep:utoipa"]
redis = ["dep:redis"]
# All auth plugins — this is what "full" means to users.
# Real apps use `full` + one backend (e.g., `yauth = { features = ["full", "diesel-pg-backend"] }`).
full = ["email-password", "passkey", "mfa", "oauth", "bearer", "api-key", "magic-link", "admin", "status", "oauth2-server", "account-lockout", "webhooks", "oidc", "asymmetric-jwt", "telemetry", "openapi", "organizations", "scim", "audit-export"]
# CI-only — every backend + redis, for conformance testing. Never recommended for production.
# NOTE: diesel-libsql-backend is excluded because libsql-ffi bundles its own sqlite3.c,
# which produces duplicate symbols with libsqlite3-sys (used by diesel-sqlite + sqlx-sqlite).
# Test diesel-libsql separately: --features full,diesel-libsql-backend
all-backends = ["diesel-pg-backend", "diesel-mysql-backend", "diesel-sqlite-backend", "sqlx-pg-backend", "sqlx-mysql-backend", "sqlx-sqlite-backend", "seaorm-pg-backend", "seaorm-mysql-backend", "seaorm-sqlite-backend", "memory-backend", "redis"]

[dependencies]
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }

# Diesel (optional — pulled in by diesel-pg-backend or diesel-libsql-backend)
diesel = { workspace = true, optional = true }
diesel-async-crate = { version = "0.8", features = ["deadpool"], package = "diesel-async", optional = true }
diesel-libsql = { version = "0.1.4", features = ["async", "deadpool"], optional = true }
futures-util = { version = "0.3", optional = true }
# libsqlite3-sys bundled feature: diesel/sqlite pulls this in transitively.
# We don't need it as a direct dep — diesel's `sqlite` feature handles it.
# NOTE: sqlx-sqlite-backend and diesel-sqlite-backend CANNOT be enabled simultaneously
# due to libsqlite3-sys version conflicts (sqlx 0.8 uses 0.28, diesel 2.3 uses 0.36).

# sqlx (optional — pulled in by sqlx-*-backend features)
sqlx = { workspace = true, optional = true }

# SeaORM (optional — pulled in by seaorm-*-backend features)
sea-orm = { workspace = true, optional = true }

yauth-entity = { path = "../yauth-entity", version = "0.13.0" }

serde = { workspace = true }
serde_json = { workspace = true }

argon2 = { workspace = true }
password-hash = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha1 = { workspace = true }
sha2 = "0.11"
uuid = { workspace = true }
chrono = { workspace = true }

lettre = { workspace = true }
reqwest = { workspace = true }

# Feature-gated: Redis store backend
redis = { version = "1", features = ["aio", "tokio-comp", "connection-manager"], optional = true }

thiserror = { workspace = true }
utoipa = { workspace = true, optional = true }

# Feature-gated
webauthn-rs = { workspace = true, optional = true }

totp-rs = { workspace = true, optional = true }
qrcode-generator = { version = "5", optional = true }
oauth2 = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }

# Feature-gated: OAuth2 Server
url = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
serde_urlencoded = { version = "0.7", optional = true }

# Feature-gated: asymmetric JWT signing (RS256/ES256) + JWKS publication.
# Pinned to 0.9 / 0.13 stable — RC releases would block downstream crates.io users.
rsa = { version = "0.9", features = ["sha2"], optional = true }
p256 = { version = "0.13", features = ["pem"], optional = true }

# Feature-gated: Webhooks
hmac = { version = "0.13", optional = true }

# Feature-gated: audit-export S3 dispatcher (issue #96 Phase B).
# Default features cover memory + AWS S3 + S3-compatible (MinIO, R2). We don't
# pull GCS/Azure because they require extra system tokens; operators can fork
# if they need those backends.
object_store = { version = "0.13", default-features = false, features = ["aws"], optional = true }
bytes = { version = "1", optional = true }

# Feature-gated: audit-export TLS syslog dispatcher (port 6514).
# tokio-rustls is reused from the wider tokio runtime; we keep it gated on
# `audit-export` so apps that don't enable the plugin don't pull rustls roots.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }

opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }

log = "0.4"

# Feature-gated: verified-domain DNS TXT challenge (issue #90, `organizations` feature).
# Async resolver. tokio-runtime + system-config keeps the dep light and graceful
# when /etc/resolv.conf is unreadable (we fall back to HTTP .well-known).
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"], optional = true }

# Feature-gated: SSO OIDC client (issue #93, `organizations` feature).
# Real AEAD cipher for client_secret encrypt-at-rest. ChaCha20-Poly1305
# is constant-time without hardware AES, which matches the
# pure-Rust-by-default story.
chacha20poly1305 = { workspace = true, optional = true }

# Feature-gated: SSO SAML 2.0 SP (issue #94, `organizations` feature).
# Pure-Rust XML parser + writer; no libxml/xmlsec C bindings. The
# audited XML-DSig subset we use is narrow (RSA-SHA256 enveloped
# signatures with exclusive c14n on a single referenced element), so
# leaning on a hand-rolled verifier behind `samael::SamlProvider` is
# safer than depending on samael 0.0.20 (open signature-verification
# bugs — see #82 in njaremko/samael).
quick-xml = { version = "0.37", optional = true }
# X.509 cert parser to extract RSA SPKI from the IdP's PEM cert at
# verify time. Pure Rust.
x509-parser = { version = "0.18", optional = true }
# DEFLATE for the SAML HTTP-Redirect binding (raw DEFLATE, NOT zlib).
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }

[dev-dependencies]
yauth-entity = { path = "../yauth-entity", version = "0.13.0" }
yauth-migration = { path = "../yauth-migration", version = "0.13.0" }
env_logger = "0.11"
totp-rs = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
url = "2"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# OTel instrumentation for conformance tests (optional, via OTEL_EXPORTER_OTLP_ENDPOINT env var)
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-semantic-conventions = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.32"
serial_test = "3"
# Audit-export pentest fakes (issue #96 Phase B):
#   - wiremock: in-process fake Splunk HEC / Datadog log intake
#   - rcgen: self-signed cert for the TLS syslog test server
#   - rustls/rustls-pemfile: pinned-trust client config for syslog TLS tests
wiremock = "0.6"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"


[[example]]
name = "server"
required-features = ["full", "diesel-pg-backend"]

[[example]]
name = "e2e_test"
required-features = ["full", "diesel-pg-backend"]

[[example]]
name = "m2m_auth"
required-features = ["full", "memory-backend"]

[[example]]
name = "cross_idp_server"
required-features = ["full", "memory-backend"]
