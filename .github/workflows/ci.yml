name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --features full,all-backends -- -D warnings

      - name: Verify sqlx offline cache is complete
        run: SQLX_OFFLINE=true cargo check --workspace --features full,all-backends

      - name: Lint
        run: pnpm run lint

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Check generated client is up to date
        run: pnpm run generate:check

      - name: Build TS packages
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yauth
          POSTGRES_PASSWORD: yauth
          POSTGRES_DB: yauth_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yauth -d yauth_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: yauth
          MYSQL_USER: yauth
          MYSQL_PASSWORD: yauth
          MYSQL_DATABASE: yauth_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pyauth"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run unit tests
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --workspace --features full,all-backends --lib

      - name: Run conformance tests (7 backends)
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://yauth:yauth@127.0.0.1:5433/yauth_test
          MYSQL_DATABASE_URL: mysql://yauth:yauth@127.0.0.1:3307/yauth_test
          SQLITE_DATABASE_URL: ":memory:"
          SQLX_PG_DATABASE_URL: postgres://yauth:yauth@127.0.0.1:5433/yauth_test
          SQLX_MYSQL_DATABASE_URL: mysql://yauth:yauth@127.0.0.1:3307/yauth_test
          SQLX_SQLITE_DATABASE_URL: "sqlite::memory:"
        run: cargo test --workspace --features full,all-backends --test repo_conformance

      - name: Run conformance tests (diesel-libsql, tested separately)
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --workspace --features full,diesel-libsql-backend,memory-backend --test repo_conformance

      - name: Run integration tests (parallel-safe)
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://yauth:yauth@127.0.0.1:5433/yauth_test
          MYSQL_DATABASE_URL: mysql://yauth:yauth@127.0.0.1:3307/yauth_test
        run: cargo test --workspace --features full,all-backends --test diesel_integration --test diesel_mysql_integration --test pentest

      - name: Verify generated artifacts are fresh
        run: |
          cargo install --path crates/cargo-yauth
          cargo yauth -f yauth-diesel-pg.toml generate --check
          cargo yauth -f yauth-sqlx-pg.toml generate --check
          cargo yauth -f yauth-sqlx-mysql.toml generate --check
          cargo yauth -f yauth-sqlx-sqlite.toml generate --check
          cargo yauth -f yauth-toasty.toml generate --check

  # yauth-toasty is excluded from the root workspace because toasty-driver-sqlite
  # (via rusqlite → libsqlite3-sys 0.37) and sqlx-sqlite (via libsqlite3-sys 0.30)
  # both declare `links = "sqlite3"` which Cargo forbids in one resolved graph.
  # This job covers yauth-toasty via `--manifest-path` across the three relational
  # backends (sqlite, postgresql, mysql), matching the pattern used for the main
  # `test` job above.
  toasty:
    name: yauth-toasty (${{ matrix.backend }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgresql, mysql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yauth
          POSTGRES_PASSWORD: yauth
          POSTGRES_DB: yauth_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yauth -d yauth_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: yauth
          MYSQL_USER: yauth
          MYSQL_PASSWORD: yauth
          MYSQL_DATABASE: yauth_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pyauth"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      # Keep env vars defined unconditionally — unused services are harmless.
      DATABASE_URL: postgres://yauth:yauth@127.0.0.1:5433/yauth_test
      MYSQL_DATABASE_URL: mysql://yauth:yauth@127.0.0.1:3307/yauth_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Format check
        run: cargo fmt --manifest-path crates/yauth-toasty/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path crates/yauth-toasty/Cargo.toml --features full,${{ matrix.backend }} --all-targets -- -D warnings

      - name: Test (conformance)
        # --test-threads=1: the conformance harness shares a single
        # `Repositories` per backend via OnceCell (see tests/conformance.rs
        # header comment). Parallel execution has tests clobber each
        # other's shared DB state. Per-test backend isolation is a
        # follow-up; serialized tests finish in ~5s for sqlite.
        run: cargo test --manifest-path crates/yauth-toasty/Cargo.toml --features full,${{ matrix.backend }} --test conformance -- --test-threads=1

      - name: Test (migrations — sqlite only)
        if: matrix.backend == 'sqlite'
        run: cargo test --manifest-path crates/yauth-toasty/Cargo.toml --features full,sqlite --test migrations

  openapi-conformance:
    name: OpenAPI conformance (Rust ↔ Go)
    runs-on: ubuntu-latest
    # Hard-gated: any BREAKING / MISSING / SHAPE / GO-EXTRA divergence
    # against yauth-go fails the build. Phase 1 of the convergence plan
    # closed all four categories — any new drift is a real regression.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify openapi.json is up to date
        # The Rust spec is committed; the test below regenerates it and
        # asserts byte-equality.
        run: SQLX_OFFLINE=true cargo test --features full,memory-backend -p yauth --test generate_client -- check_openapi_spec_up_to_date --exact --nocapture

      - name: Fetch yauth-go openapi.json from main
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsSL -o tmp/go-openapi.json \
            https://raw.githubusercontent.com/yackey-labs/yauth-go/main/openapi.json

      - name: Strict conformance gate
        run: |
          # Scripts are vendored from yauth-go/scripts/ — keeping them
          # local means the CI gate works even when yauth-go's main has
          # not yet been pushed. The two copies are kept in sync; if they
          # drift, regenerate from the canonical yauth-go versions.
          python3 scripts/openapi-conformance.py \
            openapi.json tmp/go-openapi.json

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

