<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server A – IdP (cross-IdP demo)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #fff8f0; color: #1a1a1a; }
      #app { max-width: 480px; margin: 60px auto; padding: 24px; }
      h1 { margin-bottom: 8px; font-size: 24px; }
      h2 { font-size: 16px; margin: 12px 0 8px; color: #444; font-weight: 600; }
      .badge { display: inline-block; background: #fde2c4; color: #8a4a1a; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-left: 6px; }
      .card { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-top: 16px; }
      .nav { display: flex; gap: 12px; margin-bottom: 16px; }
      .nav a { color: #8a4a1a; text-decoration: none; font-weight: 500; }
      input { display: block; width: 100%; padding: 10px 12px; margin: 6px 0 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
      button { cursor: pointer; padding: 10px 18px; border: 1px solid #8a4a1a; background: #8a4a1a; color: white; border-radius: 6px; font-weight: 500; }
      button.secondary { background: white; color: #8a4a1a; }
      .muted { color: #777; font-size: 13px; }
      .row { display: flex; gap: 12px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
