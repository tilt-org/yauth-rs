<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server B – App (cross-IdP demo)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #f5f7fb; color: #1a1a1a; }
      #app { max-width: 560px; margin: 60px auto; padding: 24px; }
      h1 { margin-bottom: 8px; font-size: 24px; }
      h2 { font-size: 16px; margin: 12px 0 8px; color: #444; font-weight: 600; }
      .badge { display: inline-block; background: #e5edff; color: #1a3a8a; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-left: 6px; }
      .card { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-top: 16px; }
      .sso-btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border: 1px solid #1a3a8a; background: #1a3a8a; color: white; border-radius: 6px; text-decoration: none; font-weight: 500; }
      .sso-btn:hover { background: #15307a; }
      pre { background: #0f1419; color: #eee; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; line-height: 1.5; }
      button { cursor: pointer; padding: 8px 16px; border: 1px solid #ccc; border-radius: 6px; background: white; }
      .muted { color: #777; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
